<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save the Date</title>

  <!-- Fuentes -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Great+Vibes&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Tangerine:wght@400;700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/countdown.css">
</head>

<body>

  <section class="hero">
    <div class="content">
      <div class="top-section">
        <h1 class="title">
          SAVE <span>the</span> DATE
        </h1>
        <div class="names">Laura & Alberto</div>
      </div>

      <div class="bottom-section">
        <div class="date">
          03 · 10 · 2026
        </div>
        <div id="contador" class="countdown">Cargando…</div>
        
        <!-- Botón Añadir al Calendario -->
        <div class="calendar-container">
          <button id="calendarBtn" class="calendar-button" aria-label="Añadir al calendario">
             Añadir al calendario
          </button>
          <div id="calendarMenu" class="calendar-menu hidden">
            <a href="#" id="googleCalendar" class="calendar-option">
              Google Calendar
            </a>
            <a href="#" id="appleCalendar" class="calendar-option">
              Apple Calendar
            </a>
          </div>
        </div>
      </div>

      <!--<button id="enterBtn" class="main-button" aria-label="Entrar a la web">Entrar</button>-->
    </div>
  </section>

  <!-- JS -->
  <script src="assets/js/countdown.js"></script>
</body>
</html>
